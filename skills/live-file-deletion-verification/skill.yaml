name: live_file_deletion_verification
title: Live File Deletion Verification
description: Verify each live file against its upload receipt by hash before deleting it, and never invent a protection that contradicts the user order.
category: Work and knowledge
include_in_prompt: false
skill_improvement:
  managed: true
  status: active
  measurement:
    proxy_metric_id: objective_success_rate
    success_criterion: Within 14 days, no live file deletion batch deletes a file without an upload receipt and a matching hash, and no deletion report claims hash verification for a file that was not hash checked.
